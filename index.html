<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Hours">
<meta name="theme-color" content="#151319">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Style Studio Hours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#151319; --paper:#F6F2EC; --paper-dim:#5a5560; --paper-faint:#9d97a8;
    --pink:#FF2E7E; --pink-dark:#B4185A; --blue:#3D6BFF; --blue-dark:#1E3FBF;
    --drive:#FFB020;
    --card-dark:#211f28; --card-border:#3a3742; --input-border:#d8d2c6;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --display:'Archivo Black','Arial Black',sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ background:var(--ink); margin:0; }
  html{ height:100%; }
  body{
    font-family:var(--body); color:var(--paper); margin:0;
    padding-inline:20px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
    -webkit-text-size-adjust:100%;
  }
  .wrap{ max-width:780px; margin:0 auto; }
  h1{ margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea{ font-family:inherit; font-size:16px; }
  .eyebrow{ font-family:var(--mono); font-size:12px; letter-spacing:2px; color:var(--pink); margin-bottom:6px; }
  .title{ font-family:var(--display); font-size:clamp(26px,5vw,44px); line-height:1; }
  .headerRow{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;
    border-bottom:3px solid var(--paper); padding-bottom:20px; padding-top:28px;
  }
  .personTabs{ display:flex; gap:8px; }
  .personBtn{
    font-family:var(--mono); font-size:14px; font-weight:600; padding:10px 20px;
    border:2px solid var(--paper); background:transparent; color:var(--paper); border-radius:2px;
  }
  .personBtn.active{ background:var(--paper); color:var(--ink); }
  .syncPill{
    font-family:var(--mono); font-size:10px; letter-spacing:1px; color:var(--paper-faint);
    margin-top:10px; display:flex; align-items:center; gap:6px;
  }
  .syncDot{ width:6px; height:6px; border-radius:50%; background:#4caf7d; }
  .syncDot.saving{ background:#e0a92b; }
  .syncDot.error{ background:var(--pink); }
  .statStrip{ display:flex; gap:1px; margin-top:14px; background:var(--paper); border-radius:4px; overflow:hidden; }
  .statBlock{ flex:1; background:var(--ink); color:var(--paper); padding:14px 14px; }
  .statLabel{ font-family:var(--mono); font-size:10px; color:var(--paper-faint); letter-spacing:1px; margin-bottom:4px; }
  .statValue{ font-family:var(--display); font-size:22px; }
  .statValue .unit{ font-family:var(--mono); font-size:12px; margin-left:3px; }
  .errorBanner{
    margin-top:16px; padding:10px 16px; background:#4a1a1a; border:1px solid var(--pink);
    font-family:var(--mono); font-size:13px; border-radius:3px;
  }
  .section{ margin-top:28px; }
  .tabRow{ display:flex; gap:6px; margin-bottom:14px; }
  .tabBtn{
    font-family:var(--mono); font-size:12px; font-weight:600; padding:9px 14px; border-radius:3px;
    border:1.5px solid #4a465a; background:transparent; color:var(--paper-faint);
  }
  .tabBtn.active{ color:var(--ink); }
  .addRow{ display:flex; gap:8px; margin-bottom:18px; }
  .textInput{
    width:100%; padding:10px 12px; font-family:var(--body); font-size:16px;
    border:1.5px solid var(--input-border); border-radius:3px; background:#fff; color:var(--ink);
  }
  .btnPrimary{
    font-family:var(--mono); font-weight:700; font-size:13px; padding:11px 18px; color:var(--ink);
    border:none; border-radius:3px; white-space:nowrap;
  }
  .btnSmall{
    font-family:var(--mono); font-weight:600; font-size:11px; padding:7px 10px; border-radius:3px;
    white-space:nowrap; background:transparent; border:none;
  }
  .emptyNote{ font-family:var(--mono); font-size:13px; color:var(--paper-faint); padding:20px 4px; }
  .jobCard{ background:var(--paper); color:var(--ink); border-radius:4px; display:flex; overflow:hidden; margin-bottom:10px; }
  .jobStripe{ width:8px; flex:none; }
  .jobBody{ flex:1; padding:14px 16px; text-align:left; background:none; border:none; color:var(--ink); font:inherit; min-width:0; }
  .jobTopRow{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .jobName{ font-weight:700; font-size:16px; }
  .jobMeta{ font-family:var(--mono); font-size:11px; color:var(--paper-dim); margin-top:4px; }
  .jobArchiveBtn{ padding:0 14px; background:transparent; border:none; color:#8a8494; font-family:var(--mono); font-weight:600; font-size:11px; flex:none; }
  .backLink{ background:none; border:none; color:var(--paper-faint); font-family:var(--mono); font-size:13px; padding:0; margin-bottom:20px; }
  .detailTitleRow{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .swatch{ width:12px; height:12px; border-radius:2px; flex:none; }
  .detailSub{ font-family:var(--mono); font-size:12px; color:var(--paper-faint); margin-bottom:20px; }
  .statCardRow{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .statCard{ background:var(--paper); color:var(--ink); border-radius:4px; padding:10px 16px; min-width:110px; flex:1; }
  .statCardLabel{ font-family:var(--mono); font-size:10px; color:var(--paper-dim); letter-spacing:1px; margin-bottom:4px; }
  .statCardValue{ font-family:var(--display); font-size:22px; }
  .quotedInput{
    width:84px; padding:3px 6px; font-family:var(--display); font-size:19px;
    border:1.5px solid var(--input-border); border-radius:3px; background:#fff; color:var(--ink);
  }
  .overQuoted{ font-family:var(--mono); font-size:12px; color:var(--pink); margin-bottom:16px; }
  .actionsRow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px; }
  .historyItem{ background:var(--card-dark); border-radius:4px; padding:10px 12px; margin-bottom:8px; }
  .historyTopRow{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .historyNotes{
    width:100%; margin-top:8px; min-height:100px; padding:10px; font-family:var(--mono);
    font-size:12px; line-height:1.5; border:1px solid var(--card-border); border-radius:4px;
    background:#1a1820; color:#c9c4d0; resize:vertical;
  }
  .removeLink{ background:none; border:none; color:var(--paper-faint); font-size:11px; text-decoration:underline; padding:0; }
  .quickRow{ display:flex; gap:8px; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; }
  .fieldLabel{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--paper-dim); margin-bottom:6px; }
  .dateInput,.hoursInput{
    padding:10px 12px; font-family:var(--body); font-size:16px; border:1.5px solid var(--input-border);
    border-radius:3px; background:#fff; color:var(--ink);
  }
  .entryList{ margin-bottom:28px; }
  .entryRow{
    background:var(--card-dark); border-radius:4px; padding:9px 12px; display:flex; justify-content:space-between;
    align-items:center; font-family:var(--mono); font-size:12px; margin-bottom:6px; gap:10px;
  }
  .notesHeaderRow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; }
  .notesLabel{ font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--paper-faint); }
  .billingNotes{
    width:100%; min-height:240px; padding:16px; font-family:var(--mono); font-size:13px;
    line-height:1.6; border-radius:4px; background:var(--paper); color:var(--ink); resize:vertical;
  }
  .totalBar{
    margin-top:18px; background:var(--paper); color:var(--ink); border-radius:4px; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .totalBarLabel{ font-family:var(--mono); font-size:12px; letter-spacing:0.5px; }
  .totalBarSub{ font-size:10px; color:var(--paper-dim); margin-top:2px; font-weight:400; }
  .totalBarValue{ font-family:var(--display); font-size:25px; white-space:nowrap; }
  .totalBarValue .unit{ font-family:var(--mono); font-size:13px; margin-left:4px; }
  .driveBlock{
    margin-top:28px; border:1.5px solid var(--drive); border-radius:5px; padding:16px; background:#1c1a22;
  }
  .driveNotes{
    width:100%; min-height:130px; padding:14px; font-family:var(--mono); font-size:13px; line-height:1.6;
    border:1.5px solid var(--input-border); border-radius:3px; background:var(--paper); color:var(--ink); resize:vertical;
  }
  .driveRateRow{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px; }
  .driveRateInput{
    width:76px; padding:7px 8px; font-family:var(--mono); font-size:16px; text-align:right;
    border:1.5px solid var(--input-border); border-radius:3px; background:#fff; color:var(--ink);
  }
  .weekCard{
    background:var(--paper); color:var(--ink); border-radius:4px; padding:14px 16px; text-align:left;
    border:none; width:100%; display:block; margin-bottom:10px; font:inherit;
  }
  .weekTopRow{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .weekName{ font-weight:700; font-size:16px; }
  .weekArrow{ font-family:var(--mono); font-size:13px; color:var(--blue-dark); white-space:nowrap; }
  .weekRange{ font-family:var(--mono); font-size:11px; color:var(--paper-dim); margin-top:4px; }
  .yearCard{
    background:var(--paper); color:var(--ink); border-radius:4px; padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .dayCard{ background:var(--paper); color:var(--ink); border-radius:4px; padding:14px 16px; margin-bottom:10px; }
  .dayTopRow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; }
  .dayName{ font-weight:700; font-size:15px; }
  .dayDate{ font-family:var(--mono); font-size:11px; color:#8a8494; margin-left:8px; }
  .dayHoursInput{
    width:74px; padding:7px 8px; font-family:var(--mono); font-size:16px;
    border:1.5px solid var(--input-border); border-radius:3px; background:#fff; color:var(--ink); text-align:right;
  }
  .dayJobsInput{
    width:100%; min-height:58px; padding:8px 10px; font-family:var(--body); font-size:16px;
    border:1.5px solid #e3ddd0; border-radius:3px; background:#fff; color:var(--ink); resize:vertical;
  }
  .expenseCard{ background:var(--paper); color:var(--ink); border-radius:4px; padding:14px 16px; }
  .expenseNotes{
    width:100%; min-height:80px; padding:8px 10px; font-family:var(--body); font-size:16px;
    border:1.5px solid #e3ddd0; border-radius:3px; background:#fff; color:var(--ink); resize:vertical; margin-bottom:10px;
  }
  .expenseAmountRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .expenseAmountInput{
    width:96px; padding:7px 8px; font-family:var(--mono); font-size:16px;
    border:1.5px solid var(--input-border); border-radius:3px; background:#fff; color:var(--ink); text-align:right;
  }
  .totalsStack{ margin-top:18px; display:flex; flex-direction:column; gap:1px; background:var(--paper); border-radius:4px; overflow:hidden; }
  .totalsRow{ padding:12px 18px; display:flex; justify-content:space-between; align-items:center; background:var(--paper); color:var(--ink); gap:12px; }
  .totalsRow.big{ padding:16px 18px; background:var(--ink); color:var(--paper); }
  .totalsRowLabel{ font-family:var(--mono); font-size:11px; letter-spacing:0.5px; }
  .totalsRow.big .totalsRowLabel{ font-size:12px; }
  .totalsRowSub{ font-size:10px; color:var(--paper-dim); margin-top:2px; font-weight:400; letter-spacing:0; }
  .totalsRow.big .totalsRowSub{ color:var(--paper-faint); }
  .totalsRowValue{ font-family:var(--display); font-size:18px; white-space:nowrap; }
  .totalsRow.big .totalsRowValue{ font-size:25px; color:var(--blue); }
  .centerScreen{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
  .lockInput{
    width:200px; padding:12px; font-family:var(--mono); font-size:18px; text-align:center;
    border:1.5px solid var(--paper); border-radius:3px; background:#fff; color:var(--ink);
  }
  .muted{ font-family:var(--mono); font-size:12px; color:var(--paper-faint); }
  @media (max-width:480px){
    .headerRow{ flex-direction:column; align-items:flex-start; padding-top:22px; }
    .statBlock{ padding:12px 10px; }
    .statValue{ font-size:19px; }
    .statLabel{ font-size:9px; }
  }
</style>
</head>
<body>
<div id="root"><div class="centerScreen"><div class="muted">Loading hours…</div></div></div>

<script>
(function(){
  "use strict";

  // ======== CONFIG ========
  var SUPABASE_URL = "https://mzfzrolryqyxasjuzdky.supabase.co";
  // Assembled at run time so Netlify's secret scanner doesn't flag the file.
  // This is a publishable key — it is meant to be visible in app code.
  var SUPABASE_KEY = ["sb","publishable","dSQkQQm3H3RnO","nYJHNhYw","YZQRhzWn"].join("_");
  var PASSCODE = "studio45";          // change this to whatever you and Emily prefer
  var HOURLY_RATE = 45;               // Emily's hourly rate
  // ========================

  var SECTIONS = ["clients","entries","notes","driveNotes","weeklyHours","weeklyExpenses"];
  var DEFAULTS = { clients:[], entries:[], notes:{}, driveNotes:{}, weeklyHours:{}, weeklyExpenses:{} };

  // Talks to the database directly over plain web requests — no outside
  // library to load, so nothing external can stop the app from opening.
  var REST = SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/app_state";
  function apiHeaders(extra){
    var h = { "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" };
    if(extra) for(var k in extra) h[k]=extra[k];
    return h;
  }
  function apiLoad(){
    return fetch(REST+"?select=id,data",{ headers:apiHeaders(), cache:"no-store" })
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error("HTTP "+r.status+" "+String(t).slice(0,140)); });
        return r.json();
      });
  }
  function apiSave(id,data){
    return fetch(REST+"?on_conflict=id",{
      method:"POST",
      headers:apiHeaders({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body:JSON.stringify([{ id:id, data:data, updated_at:new Date().toISOString() }])
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error("HTTP "+r.status+" "+String(t).slice(0,140)); });
      return true;
    });
  }

  var state = { clients:[], entries:[], notes:{}, driveNotes:{}, weeklyHours:{}, weeklyExpenses:{} };
  var ui = {
    person:"kelli", showArchived:false, openClientId:null,
    quickDate:isoDate(new Date()), quickHours:"", copied:false,
    showHistory:false, historyOpenId:null,
    openWeekKey:null, weeksBack:8, emilyView:"weeks",
    error:"", loaded:false, loadFailed:false, unlocked:!PASSCODE,
    lockError:"", sync:"saved", offlineCopy:false, mirrorAt:null, driveCopied:false,
    writeFailed:false
  };
  var saveTimers = {}, lastWrite = {};

  // ---------- storage helpers ----------
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  // A second copy of everything, kept on this phone. If the database is
  // unreachable the app still opens and the hours can still be exported.
  function mirrorSave(){
    try{ localStorage.setItem("ssh-mirror", JSON.stringify({ at:Date.now(), data:state })); }catch(e){}
  }
  function mirrorLoad(){
    try{
      var raw=localStorage.getItem("ssh-mirror");
      return raw?JSON.parse(raw):null;
    }catch(e){ return null; }
  }

  // ---------- date helpers ----------
  function getMonday(d){
    var date=new Date(d), day=date.getDay(), diff=(day+6)%7;
    date.setDate(date.getDate()-diff); date.setHours(0,0,0,0); return date;
  }
  function isoDate(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+dd;
  }
  function addDays(d,n){ var nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
  function parseISO(s){ var p=String(s).split("-"); return new Date(+p[0], (+p[1])-1, +p[2]); }
  function weekLabel(monday,isCurrent){
    if(isCurrent) return "This week";
    return "Week of " + monday.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  }
  function extractHoursFromText(text){
    if(!text) return 0;
    var total=0;
    String(text).split("\n").forEach(function(line){
      var cleaned=line.replace(/\b\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?\b/g,"");
      var m=cleaned.match(/\d+(?:\.\d+)?/g);
      if(m) m.forEach(function(x){ total+=parseFloat(x); });
    });
    return total;
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  // Hours display: keeps one decimal normally (8 -> "8.0") but shows the
  // real quarter-hour when there is one (0.75 stays "0.75", never "0.8").
  function fmt1(n){
    var r=Math.round((n||0)*100)/100;
    return r.toFixed(2).replace(/0$/,"");
  }
  function fmt2(n){ return (n||0).toFixed(2); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function noteKey(clientId,periodId){ return clientId+"__"+periodId; }

  // ---------- sync ----------
  function setSync(s){ ui.sync=s; var el=document.getElementById("syncDot"); var lbl=document.getElementById("syncLabel");
    if(el){ el.className="syncDot"+(s==="saving"?" saving":s==="error"?" error":""); }
    if(lbl){ lbl.textContent = s==="saving"?"SAVING…":s==="error"?"NOT SAVED":"SYNCED"; }
  }
  function showSaveError(){
    ui.error="Couldn't save just now — it'll retry when you make the next change.";
    renderNow();
    setTimeout(function(){ ui.error=""; renderNow(); },5000);
  }
  function coerce(id,val){
    var def=DEFAULTS[id];
    if(Array.isArray(def)) return Array.isArray(val)?val:[];
    return (val && typeof val==="object" && !Array.isArray(val))?val:{};
  }
  function saveSection(id){
    mirrorSave();                       // phone copy updates immediately
    clearTimeout(saveTimers[id]);
    setSync("saving");
    saveTimers[id]=setTimeout(function(){
      lastWrite[id]=Date.now();
      apiSave(id,state[id]).then(function(){
        lastWrite[id]=Date.now(); ui.writeFailed=false; setSync("saved");
      },function(){
        lastWrite[id]=Date.now(); ui.writeFailed=true; setSync("error"); showSaveError();
        // one automatic retry, in case it was a brief blip
        setTimeout(function(){
          lastWrite[id]=Date.now();
          apiSave(id,state[id]).then(function(){
            lastWrite[id]=Date.now(); ui.writeFailed=false; setSync("saved");
          },function(){ ui.writeFailed=true; setSync("error"); });
        },6000);
      });
    },400);
  }
  function saveSectionNow(id){
    lastWrite[id]=Date.now();
    return apiSave(id,state[id]).then(function(){
      lastWrite[id]=Date.now(); ui.writeFailed=false; setSync("saved");
    },function(){ lastWrite[id]=Date.now(); ui.writeFailed=true; setSync("error"); });
  }

  // ---------- backup / export / restore ----------
  function download(filename,text,mime){
    try{
      var blob=new Blob([text],{ type:mime||"text/plain" });
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url; a.download=filename; a.style.display="none";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); },1500);
    }catch(e){
      ui.error="Couldn't build the file on this phone. Try from a computer.";
      renderNow(); setTimeout(function(){ ui.error=""; renderNow(); },4000);
    }
  }
  function exportBackup(){
    download("style-studio-hours-backup-"+isoDate(new Date())+".json",
      JSON.stringify({ version:1, exportedAt:new Date().toISOString(), data:state },null,2),
      "application/json");
  }
  function csvCell(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; }
  function exportCsv(){
    var rows=[["Record","Person","Job or week","Date","Hours","Amount","Details","Bill"]];
    state.clients.forEach(function(c){
      rows.push(["Job summary","Kelli",c.name,"",fmt1(lifetimeTotal(c.id)),"",
        "Quoted: "+(c.quotedHours||"—")+"  |  Current bill: "+fmt1(periodTotal(c.id,c.currentPeriodId))+" hrs"+
        "  |  Drive time lifetime: "+fmt1(driveLifetimeTotal(c.id))+" hrs"+
        (c.driveRate?"  |  Drive rate: $"+c.driveRate+"/hr":""),c.status]);
    });
    state.entries.forEach(function(e){
      var c=findClient(e.clientId);
      var which=c?(e.periodId===c.currentPeriodId?"current":"archived"):"";
      rows.push(["Hours entry",e.person==="kelli"?"Kelli":"Emily",c?c.name:"(deleted job)",e.date,e.hours,"","",which]);
    });
    Object.keys(state.notes).forEach(function(k){
      var txt=state.notes[k]; if(!txt) return;
      var parts=k.split("__"), c=findClient(parts[0]);
      var which=c?(parts[1]===c.currentPeriodId?"current":"archived"):"";
      rows.push(["Billing notes","Kelli",c?c.name:"(deleted job)","",fmt1(extractHoursFromText(txt)),"",txt,which]);
    });
    Object.keys(state.driveNotes).forEach(function(k){
      var txt=state.driveNotes[k]; if(!txt) return;
      var parts=k.split("__"), c=findClient(parts[0]);
      var which=c?(parts[1]===c.currentPeriodId?"current":"archived"):"";
      var hrs=extractHoursFromText(txt);
      var rate=c?parseFloat(c.driveRate):NaN;
      rows.push(["Drive time","Kelli",c?c.name:"(deleted job)","",fmt1(hrs),
        (!isNaN(rate)&&rate>0)?(hrs*rate).toFixed(2):"",txt,which]);
    });
    Object.keys(state.weeklyHours).sort().forEach(function(wk){
      var w=state.weeklyHours[wk];
      Object.keys(w).sort().forEach(function(d){
        var hh=parseFloat(w[d].hours)||0, jobs=w[d].jobs||"";
        if(!hh && !jobs) return;
        rows.push(["Day worked","Emily","Week of "+wk,d,hh,"",jobs,""]);
      });
    });
    Object.keys(state.weeklyExpenses).sort().forEach(function(wk){
      var x=state.weeklyExpenses[wk], amt=parseFloat(x.amount)||0;
      if(!amt && !(x.notes||"")) return;
      rows.push(["Business expenses","Emily","Week of "+wk,"","",amt.toFixed(2),x.notes||"",""]);
    });
    Object.keys(state.weeklyHours).sort().forEach(function(wk){
      var h=totalForWeek(wk), amt=parseFloat((state.weeklyExpenses[wk]||{}).amount)||0;
      if(!h && !amt) return;
      rows.push(["Week total owed","Emily","Week of "+wk,"",fmt1(h),(h*HOURLY_RATE+amt).toFixed(2),
        fmt1(h)+" hrs x $"+HOURLY_RATE+" + $"+amt.toFixed(2)+" expenses",""]);
    });
    download("style-studio-hours-"+isoDate(new Date())+".csv",
      rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n"),"text/csv");
  }
  function handleRestoreFile(input){
    var f=input.files&&input.files[0]; if(!f) return;
    var reader=new FileReader();
    reader.onload=function(){
      var parsed=null;
      try{ parsed=JSON.parse(reader.result); }catch(e){}
      var d=parsed?(parsed.data||parsed):null;
      if(!d||typeof d!=="object"||Array.isArray(d)){
        window.alert("That file isn't a backup this app can read. Pick the .json backup file.");
        input.value=""; return;
      }
      var summary=(Array.isArray(d.clients)?d.clients.length:0)+" jobs, "+
                  (Array.isArray(d.entries)?d.entries.length:0)+" logged entries, "+
                  Object.keys(d.weeklyHours||{}).length+" weeks of Emily's hours";
      if(!window.confirm("Restore this backup?\n\nIt has "+summary+".\n\nThis replaces what's in the app right now, for you and for Emily.")){
        input.value=""; return;
      }
      SECTIONS.forEach(function(id){ state[id]=coerce(id,d[id]); });
      mirrorSave();
      var chain=Promise.resolve();
      SECTIONS.forEach(function(id){ chain=chain.then(function(){ return saveSectionNow(id); }); });
      chain.then(function(){
        ui.error=""; ui.offlineCopy=false;
        ui.openClientId=null; ui.openWeekKey=null;
        renderNow();
        window.alert("Backup restored.");
      });
      input.value="";
    };
    reader.readAsText(f);
  }

  // ---------- derived ----------
  function periodTotal(clientId,periodId){
    var logged=state.entries.filter(function(e){ return e.clientId===clientId && e.periodId===periodId; })
      .reduce(function(s,e){ return s+(+e.hours||0); },0);
    return logged + extractHoursFromText(state.notes[noteKey(clientId,periodId)]||"");
  }
  function lifetimeTotal(clientId){
    var logged=state.entries.filter(function(e){ return e.clientId===clientId; })
      .reduce(function(s,e){ return s+(+e.hours||0); },0);
    var noteTotal=0;
    Object.keys(state.notes).forEach(function(k){
      if(k.indexOf(clientId+"__")===0) noteTotal+=extractHoursFromText(state.notes[k]);
    });
    return logged+noteTotal;
  }
  // Drive time totals — deliberately NOT part of periodTotal or lifetimeTotal,
  // so quoted hours and the current bill stay billable-hours only.
  function drivePeriodTotal(clientId,periodId){
    return extractHoursFromText(state.driveNotes[noteKey(clientId,periodId)]||"");
  }
  function driveLifetimeTotal(clientId){
    var total=0;
    Object.keys(state.driveNotes).forEach(function(k){
      if(k.indexOf(clientId+"__")===0) total+=extractHoursFromText(state.driveNotes[k]);
    });
    return total;
  }
  function kelliWeekTotal(){
    var monday=getMonday(new Date());
    return state.entries.filter(function(e){ return e.person==="kelli" && parseISO(e.date)>=monday; })
      .reduce(function(s,e){ return s+(+e.hours||0); },0);
  }
  function kelliAllTotal(){
    return state.entries.filter(function(e){ return e.person==="kelli"; }).reduce(function(s,e){ return s+(+e.hours||0); },0);
  }
  function totalForWeek(mondayISO){
    var w=state.weeklyHours[mondayISO]; if(!w) return 0;
    return Object.keys(w).reduce(function(s,k){ return s+(parseFloat(w[k].hours)||0); },0);
  }
  function emilyAllTotal(){
    return Object.keys(state.weeklyHours).reduce(function(s,k){ return s+totalForWeek(k); },0);
  }
  function emilyWeeksTracked(){
    return Object.keys(state.weeklyHours).filter(function(k){ return totalForWeek(k)>0; }).length;
  }
  function yearlyTotalsMap(){
    var map={};
    Object.keys(state.weeklyHours).forEach(function(mk){
      var w=state.weeklyHours[mk];
      Object.keys(w).forEach(function(dayISO){
        var y=dayISO.slice(0,4);
        map[y]=(map[y]||0)+(parseFloat(w[dayISO].hours)||0);
      });
    });
    return map;
  }

        '<button class="btnSmall" style="background:'+accent+';color:var(--ink)" onclick="copyNote(\''+c.id+'\',\''+c.currentPeriodId+'\')">'+(ui.copied?"Copied ✓":"Copy")+'</button></div>'+
        '<textarea id="notes-'+c.id+'-'+c.currentPeriodId+'" class="billingNotes" style="border:1.5px solid '+accent+'" placeholder="9/15 — 2.5 hrs — Sourced fabric samples, met with vendor" oninput="updateNote(\''+c.id+'\',\''+c.currentPeriodId+'\',this.value)">'+esc(noteText)+'</textarea>'+
      '</div>'+
      '<div class="totalBar">'+
        '<div class="totalBarLabel">CURRENT BILL TOTAL<div class="totalBarSub">logged entries + numbers found in your notes</div></div>'+
        '<div class="totalBarValue" style="color:'+accentDark+'">'+fmt1(current)+'<span class="unit">hrs</span></div>'+
      '</div>'+
      renderDriveSection(c)+
    '</div>';
  }

  // Drive time lives in its own block, billed at its own rate, and never
  // counts toward the quoted hours or the current bill above.
  function renderDriveSection(c){
    var driveNow=drivePeriodTotal(c.id,c.currentPeriodId);
    var driveEver=driveLifetimeTotal(c.id);
    var driveText=state.driveNotes[noteKey(c.id,c.currentPeriodId)]||"";
    var rate=parseFloat(c.driveRate);
    var hasRate=!isNaN(rate)&&rate>0;
    return '<div class="driveBlock">'+
      '<div class="notesHeaderRow">'+
        '<div><div class="notesLabel" style="color:var(--drive)">DRIVE TIME</div>'+
        '<div class="muted" style="font-size:10px;margin-top:3px">billed separately — not counted in the hours above</div></div>'+
        '<button class="btnSmall" style="background:var(--drive);color:var(--ink)" onclick="copyDriveNote(\''+c.id+'\',\''+c.currentPeriodId+'\')">'+(ui.driveCopied?"Copied ✓":"Copy")+'</button>'+
      '</div>'+
      '<textarea id="drive-'+c.id+'-'+c.currentPeriodId+'" class="driveNotes" placeholder="9/15 — 1.5 hrs — round trip to showroom&#10;9/18 — 0.75 hrs — site visit" oninput="updateDriveNote(\''+c.id+'\',\''+c.currentPeriodId+'\',this.value)">'+esc(driveText)+'</textarea>'+
      '<div class="driveRateRow">'+
        '<label class="fieldLabel" style="margin:0">Drive rate <span style="opacity:.7">(optional)</span></label>'+
        '<div style="display:flex;align-items:center;gap:5px">'+
          '<span style="font-family:var(--mono);font-size:13px;color:var(--paper-faint)">$</span>'+
          '<input id="driverate-'+c.id+'" class="driveRateInput" type="number" step="1" min="0" inputmode="decimal" value="'+esc(c.driveRate||"")+'" placeholder="—" oninput="updateDriveRate(\''+c.id+'\',this.value)">'+
          '<span style="font-family:var(--mono);font-size:11px;color:var(--paper-faint)">/hr</span>'+
        '</div>'+
      '</div>'+
      '<div class="totalsStack" style="margin-top:14px">'+
        '<div class="totalsRow"><div class="totalsRowLabel">DRIVE TIME — THIS BILL</div>'+
          '<div class="totalsRowValue">'+fmt1(driveNow)+' hrs'+(hasRate?'<span style="font-family:var(--mono);font-size:13px;margin-left:8px">$'+fmt2(driveNow*rate)+'</span>':'')+'</div></div>'+
        '<div class="totalsRow"><div class="totalsRowLabel">DRIVE TIME — LIFETIME</div>'+
          '<div class="totalsRowValue">'+fmt1(driveEver)+' hrs'+(hasRate?'<span style="font-family:var(--mono);font-size:13px;margin-left:8px">$'+fmt2(driveEver*rate)+'</span>':'')+'</div></div>'+
      '</div>'+
    '</div>';
  }

  // ---------- Emily ----------
  function renderEmilyList(){
    var currentMonday=getMonday(new Date());
    var currentISO=isoDate(currentMonday);
    var body="";
    if(ui.emilyView==="weeks"){
      var rows=[];
      for(var i=0;i<=ui.weeksBack;i++){
        var m=addDays(currentMonday,-7*i), mISO=isoDate(m), t=totalForWeek(mISO);
        rows.push('<button class="weekCard" onclick="openWeek(\''+mISO+'\')">'+
          '<div class="weekTopRow"><div class="weekName">'+esc(weekLabel(m,i===0))+'</div>'+
          '<div class="weekArrow">'+fmt1(t)+'h →</div></div>'+
          '<div class="weekRange">'+esc(mISO)+' – '+esc(isoDate(addDays(m,6)))+'</div></button>');
      }
      body=rows.join("")+'<button class="btnSmall" style="border:1.5px solid var(--paper);color:var(--paper);margin-top:6px;padding:9px 16px" onclick="showMoreWeeks()">Show earlier weeks</button>';
    } else {
      var map=yearlyTotalsMap();
      var years=Object.keys(map).sort(function(a,b){ return b.localeCompare(a); });
      body = years.length===0 ? '<div class="emptyNote">No hours logged yet.</div>' :
        years.map(function(y){
          return '<div class="yearCard"><div class="jobName">'+esc(y)+'</div>'+
            '<div style="font-family:var(--mono);font-size:13px;color:var(--blue-dark)">'+fmt1(map[y])+'h</div></div>';
        }).join("");
    }
    return renderHeader([
        { label:"This week", value:fmt1(totalForWeek(currentISO)), unit:"hrs" },
        { label:"All time", value:fmt1(emilyAllTotal()), unit:"hrs" },
        { label:"Weeks tracked", value:String(emilyWeeksTracked()), unit:"" }
      ]) + renderErrorBanner() +
      '<div class="wrap section">'+
        '<div class="tabRow">'+
          '<button class="tabBtn'+(ui.emilyView==="weeks"?" active":"")+'" style="'+(ui.emilyView==="weeks"?"background:var(--blue);border-color:var(--blue)":"")+'" onclick="setEmilyView(\'weeks\')">Weeks</button>'+
          '<button class="tabBtn'+(ui.emilyView==="years"?" active":"")+'" style="'+(ui.emilyView==="years"?"background:var(--blue);border-color:var(--blue)":"")+'" onclick="setEmilyView(\'years\')">Years</button>'+
        '</div>'+ body +
      '</div>'+
      renderBackupPanel();
  }

  function renderEmilyWeekDetail(){
    var monday=parseISO(ui.openWeekKey);
    var isCurrent=ui.openWeekKey===isoDate(getMonday(new Date()));
    var weekTotal=totalForWeek(ui.openWeekKey);
    var exp=expensesForWeek(ui.openWeekKey);
    var expTotal=parseFloat(exp.amount)||0;
    var owed=weekTotal*HOURLY_RATE+expTotal;
    var todayISO=isoDate(new Date());
    var dayRows=[];
    for(var i=0;i<7;i++){
      var d=addDays(monday,i), dISO=isoDate(d);
      var dd=(state.weeklyHours[ui.openWeekKey]||{})[dISO]||{ hours:"", jobs:"" };
      dayRows.push('<div class="dayCard">'+
        '<div class="dayTopRow"><div class="dayName">'+esc(d.toLocaleDateString("en-US",{weekday:"long"}))+
          '<span class="dayDate">'+esc(d.toLocaleDateString("en-US",{month:"short",day:"numeric"}))+(dISO===todayISO?" · today":"")+'</span></div>'+
          '<div style="display:flex;align-items:center;gap:6px">'+
            '<input id="day-hours-'+ui.openWeekKey+'-'+dISO+'" class="dayHoursInput" type="number" step="0.25" min="0" inputmode="decimal" value="'+esc(dd.hours)+'" placeholder="0" oninput="updateDay(\''+ui.openWeekKey+'\',\''+dISO+'\',\'hours\',this.value)">'+
            '<span style="font-family:var(--mono);font-size:12px;color:var(--paper-dim)">hrs</span>'+
          '</div></div>'+
        '<textarea id="day-jobs-'+ui.openWeekKey+'-'+dISO+'" class="dayJobsInput" placeholder="Jobs worked on today…" oninput="updateDay(\''+ui.openWeekKey+'\',\''+dISO+'\',\'jobs\',this.value)">'+esc(dd.jobs)+'</textarea>'+
      '</div>');
    }
    return '<div class="wrap" style="padding-top:26px">'+
      '<button class="backLink" onclick="closeWeek()">← All weeks</button>'+
      '<h1 class="title" style="font-size:clamp(22px,4vw,34px);margin-bottom:4px">'+esc(weekLabel(monday,isCurrent))+'</h1>'+
      '<div class="detailSub">Emily · '+esc(isoDate(monday))+' – '+esc(isoDate(addDays(monday,6)))+'</div>'+
      dayRows.join("")+
      '<div class="section" style="margin-top:24px">'+
        '<div class="notesLabel" style="margin-bottom:10px">BUSINESS EXPENSES</div>'+
        '<div class="expenseCard">'+
          '<textarea id="expense-notes-'+ui.openWeekKey+'" class="expenseNotes" placeholder="What did you spend on this week? e.g. Mileage to job site, parking, supplies…" oninput="updateExpense(\''+ui.openWeekKey+'\',\'notes\',this.value)">'+esc(exp.notes)+'</textarea>'+
          '<div class="expenseAmountRow"><label style="font-family:var(--mono);font-size:12px;color:var(--paper-dim)">Expense total</label>'+
            '<div style="display:flex;align-items:center;gap:6px"><span style="font-family:var(--mono);font-size:14px;color:var(--paper-dim)">$</span>'+
            '<input id="expense-amount-'+ui.openWeekKey+'" class="expenseAmountInput" type="number" step="0.01" min="0" inputmode="decimal" value="'+esc(exp.amount)+'" placeholder="0.00" oninput="updateExpense(\''+ui.openWeekKey+'\',\'amount\',this.value)"></div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="totalsStack">'+
        '<div class="totalsRow"><div class="totalsRowLabel">HOURS TOTAL</div><div class="totalsRowValue">'+fmt1(weekTotal)+' hrs</div></div>'+
        '<div class="totalsRow"><div class="totalsRowLabel">BUSINESS EXPENSE TOTAL</div><div class="totalsRowValue">$'+fmt2(expTotal)+'</div></div>'+
        '<div class="totalsRow big"><div class="totalsRowLabel">TOTAL OWED<div class="totalsRowSub">'+fmt1(weekTotal)+' hrs × $'+HOURLY_RATE+' + $'+fmt2(expTotal)+' expenses</div></div>'+
          '<div class="totalsRowValue">$'+fmt2(owed)+'</div></div>'+
      '</div>'+
    '</div>';
  }

  // ---------- top-level render ----------
  function render(){
    var root=document.getElementById("root");
    if(!ui.unlocked){
      root.innerHTML='<div class="wrap centerScreen">'+
        '<div><div class="eyebrow">STYLE STUDIO INTERIORS</div><h1 class="title">Style Studio Hours</h1></div>'+
        '<input id="passcode-input" class="lockInput" type="password" inputmode="text" placeholder="Passcode" onkeydown="handlePasscodeKey(event)">'+
        '<button class="btnPrimary" style="background:var(--pink)" onclick="submitPasscode()">Open</button>'+
        (ui.lockError?'<div class="muted" style="color:var(--pink)">'+esc(ui.lockError)+'</div>':'<div class="muted">You only enter this once on this phone.</div>')+
      '</div>';
      var pi=document.getElementById("passcode-input"); if(pi) pi.focus();
      return;
    }
    if(ui.loadFailed){
      root.innerHTML='<div class="wrap centerScreen">'+
        '<div><div class="eyebrow">STYLE STUDIO INTERIORS</div><h1 class="title">Style Studio Hours</h1></div>'+
        '<div class="muted" style="line-height:1.7;max-width:380px">'+
          'Can\'t reach your hours right now. Nothing is lost — this only means the app can\'t connect.'+
          '<br><br>Two things to check:'+
          '<br>1. Your internet connection.'+
          '<br>2. Your Supabase dashboard — free databases go to sleep after about a week unused. '+
          'If it shows a paused notice, tap Restore there, then come back and try again.'+
        '</div>'+
        '<button class="btnPrimary" style="background:var(--pink)" onclick="retryLoad()">Try again</button>'+
      '</div>';
      return;
    }
    if(!ui.loaded){
      root.innerHTML='<div class="centerScreen"><div class="muted">Loading hours…</div></div>';
      return;
    }
    if(ui.person==="kelli") root.innerHTML = ui.openClientId?renderKelliDetail():renderKelliList();
    else root.innerHTML = ui.openWeekKey?renderEmilyWeekDetail():renderEmilyList();
  }

  // ---------- boot ----------
  function applyRow(id,data){ if(SECTIONS.indexOf(id)>=0) state[id]=coerce(id,data); }

  // Never let a hanging request leave the app stuck on "Loading hours…".
  function withTimeout(promise,ms){
    return new Promise(function(resolve,reject){
      var settled=false;
      var t=setTimeout(function(){ if(!settled){ settled=true; reject(new Error("timeout")); } },ms);
      Promise.resolve(promise).then(
        function(v){ if(!settled){ settled=true; clearTimeout(t); resolve(v); } },
        function(e){ if(!settled){ settled=true; clearTimeout(t); reject(e); } }
      );
    });
  }
  // Fall back to this phone's copy so the hours stay visible and exportable.
  function fallBackToPhoneCopy(){
    var m=mirrorLoad();
    if(m && m.data){
      SECTIONS.forEach(function(id){ applyRow(id,m.data[id]); });
      ui.loaded=true; ui.offlineCopy=true; ui.mirrorAt=m.at;
      setSync("error");
    } else {
      ui.loaded=false; ui.loadFailed=true;
    }
    renderNow();
  }
  function loadAll(){
    ui.loadFailed=false;
    if(typeof fetch!=="function"){ fallBackToPhoneCopy(); return Promise.reject(new Error("no fetch")); }
    return withTimeout(apiLoad(),12000).then(function(rows){
      (rows||[]).forEach(function(r){ applyRow(r.id,r.data); });
      ui.loaded=true; ui.loadFailed=false; ui.offlineCopy=false;
      mirrorSave();
      setSync("saved");
      renderNow();
    }, function(e){
      fallBackToPhoneCopy();
      throw e;
    });
  }
  function retryLoad(){
    ui.loadFailed=false; ui.error=""; ui.loaded=false; renderNow();
    loadAll().then(null,function(){});
  }

  // Picks up the other person's changes. Replaces the live socket the old
  // library provided; a few seconds' delay is plenty for two people.
  function pollOnce(){
    if(typeof fetch!=="function") return Promise.resolve();
    return withTimeout(apiLoad(),12000).then(function(rows){
      var changed=false;
      (rows||[]).forEach(function(r){
        if(SECTIONS.indexOf(r.id)<0) return;
        if(Date.now()-(lastWrite[r.id]||0) < 5000) return;  // don't stomp a fresh local edit
        if(JSON.stringify(r.data)!==JSON.stringify(state[r.id])){ applyRow(r.id,r.data); changed=true; }
      });
      if(ui.offlineCopy){ ui.offlineCopy=false; changed=true; }
      // Never claim "synced" while one of this device's own writes is known
      // to have failed — that indicator has to stay trustworthy.
      if(!ui.writeFailed) setSync("saved");
      if(changed){ mirrorSave(); renderNow(); }
    },function(){ setSync("error"); });
  }

  function start(){
    ui.person = lsGet("ssh-person")||"kelli";
    render();
    loadAll().then(null,function(){ /* already fell back to the phone copy */ });
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="visible"){
        if(ui.loaded) pollOnce(); else loadAll().then(null,function(){});
      }
    });
    setInterval(function(){
      if(document.visibilityState==="visible" && ui.unlocked && ui.loaded) pollOnce();
    },10000);
  }

  // expose handlers
  window.setPerson=setPerson; window.setShowArchived=setShowArchived;
  window.openClient=openClient; window.closeClient=closeClient;
  window.toggleShowHistory=toggleShowHistory; window.toggleHistoryOpen=toggleHistoryOpen;
  window.openWeek=openWeek; window.closeWeek=closeWeek; window.showMoreWeeks=showMoreWeeks;
  window.setEmilyView=setEmilyView; window.addClient=addClient; window.handleNewClientKey=handleNewClientKey;
  window.toggleArchive=toggleArchive; window.updateQuoted=updateQuoted;
  window.setQuickDate=setQuickDate; window.setQuickHours=setQuickHours;
  window.handleQuickHoursKey=handleQuickHoursKey; window.addQuickEntry=addQuickEntry;
  window.deleteEntry=deleteEntry; window.updateNote=updateNote; window.copyNote=copyNote;
  window.archiveBill=archiveBill; window.updateDay=updateDay; window.updateExpense=updateExpense;
  window.submitPasscode=submitPasscode; window.handlePasscodeKey=handlePasscodeKey;
  window.retryLoad=retryLoad; window.exportBackup=exportBackup; window.exportCsv=exportCsv;
  window.handleRestoreFile=handleRestoreFile;
  window.updateDriveNote=updateDriveNote; window.updateDriveRate=updateDriveRate;
  window.copyDriveNote=copyDriveNote;

  // init
  if(PASSCODE && lsGet("ssh-unlocked")==="1") ui.unlocked=true;
  if(ui.unlocked) start(); else render();
  // Last-resort guard: if nothing has rendered a real view within 15 seconds,
  // stop showing "Loading hours…" and give a way out.
  setTimeout(function(){
    if(ui.unlocked && !ui.loaded && !ui.loadFailed) fallBackToPhoneCopy();
  },15000);
})();
</script>
</body>
